<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#566512" />
    <title>Event editor</title>
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <script>
      (function initTheme() {
        try {
          var saved = localStorage.getItem("theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          console.error(":::::initTheme:::::", e);
        }
      })();
    </script>
  </head>
  <body class="bg-page font-serif text-body antialiased">
    <header class="border-b border-line">
      <div class="mx-auto flex h-16 max-w-3xl items-center gap-3 px-4">
        <img src="/logo.webp" alt="" class="h-10 w-auto" />
        <span class="font-heading text-2xl font-bold">NeoBlaze</span>
        <span class="font-display text-xs font-bold uppercase tracking-widest text-muted">Event editor</span>
      </div>
    </header>
    <main id="editor" class="mx-auto max-w-3xl px-4 py-10">
      <p class="text-muted">Loading your event...</p>
    </main>
    <script type="module" src="/src/edit.ts"></script>
  </body>
</html>
