<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bf3f00" />
    <title>NeoBlaze</title>
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <script>
      (function initTheme() {
        try {
          var saved = localStorage.getItem("theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          console.error(":::::initTheme:::::", e);
        }
      })();
    </script>
  </head>
  <body class="bg-page font-serif text-body antialiased">
    <header class="sticky top-0 z-50 border-b border-line bg-page/85 backdrop-blur">
      <div class="mx-auto flex h-20 max-w-6xl items-center justify-between px-4">
        <a href="#hero" class="flex items-center">
          <img src="/logo.webp" alt="" class="-mr-1 h-14 w-auto" />
          <span id="site-name" class="font-heading text-2xl font-bold"></span>
        </a>
        <nav id="nav-desktop" class="hidden items-center gap-6 font-display text-[15px] font-semibold uppercase tracking-wider md:flex" aria-label="Main"></nav>
        <div class="flex items-center gap-1">
          <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="rounded-full p-2 hover:bg-surface">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" />
            </svg>
          </button>
          <button id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-mobile" class="rounded-full p-2 hover:bg-surface md:hidden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
      <div id="nav-mobile" class="hidden border-t border-line md:hidden">
        <nav id="nav-mobile-links" class="mx-auto flex max-w-6xl flex-col gap-1 px-4 py-3 font-display text-[15px] font-semibold uppercase tracking-wider" aria-label="Mobile"></nav>
      </div>
    </header>

    <main>
      <section id="hero" class="min-h-[60vh] scroll-mt-20"></section>
      <section id="about" class="min-h-40 scroll-mt-20 bg-surface"></section>
      <section id="theme" class="min-h-40 scroll-mt-20"></section>
      <section id="events" class="min-h-40 scroll-mt-20 bg-surface"></section>
      <section id="event-details" class="min-h-40 scroll-mt-20"></section>
      <section id="schedule" class="min-h-40 scroll-mt-20 bg-surface"></section>
      <section id="general-rules" class="min-h-40 scroll-mt-20"></section>
      <section id="contacts" class="min-h-40 scroll-mt-20 bg-surface"></section>
    </main>

    <footer class="border-t border-line">
      <div class="mx-auto max-w-6xl space-y-1 px-4 py-8 text-center text-sm text-muted">
        <p id="footer-host" class="font-display text-xs font-bold uppercase tracking-widest"></p>
        <p id="footer-note"></p>
      </div>
    </footer>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
